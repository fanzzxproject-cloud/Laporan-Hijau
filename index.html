<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Hijau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --green-deep: #1a4731;
    --green-mid: #2d7a4f;
    --green-light: #4caf50;
    --green-pale: #e8f5e9;
    --green-accent: #00c853;
    --gray-mid: #9e9e9e;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Plus Jakarta Sans',sans-serif; background:#f0f7f0; min-height:100vh; }

  #splash {
    position:fixed; inset:0; background:var(--green-deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:999; transition:opacity .5s;
  }
  .splash-leaf {
    width:64px; height:64px; background:var(--green-accent);
    border-radius:50% 10% 50% 10%; animation:bounce 1s infinite alternate;
  }
  @keyframes bounce { from{transform:translateY(0) rotate(-10deg)} to{transform:translateY(-14px) rotate(-10deg)} }
  #splash h1 { color:#fff; font-size:28px; font-weight:800; margin-top:20px; letter-spacing:-.5px; }
  #splash p { color:#a5d6a7; font-size:14px; margin-top:6px; }

  .app { display:none; flex-direction:column; min-height:100vh; }
  .app.active { display:flex; }

  .header {
    background:var(--green-deep); color:#fff; padding:14px 20px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 2px 12px rgba(0,0,0,.2); position:sticky; top:0; z-index:100;
  }
  .header-dot { width:26px; height:26px; background:var(--green-accent); border-radius:50% 8% 50% 8%; flex-shrink:0; }
  .header h1 { font-size:18px; font-weight:800; flex:1; }
  .badge { background:var(--green-accent); color:#fff; font-size:10px; font-weight:700; padding:3px 10px; border-radius:20px; }

  .hero {
    background:linear-gradient(135deg, var(--green-deep) 0%, var(--green-mid) 100%);
    padding:22px 20px 34px; color:#fff; position:relative; overflow:hidden;
  }
  .hero::after {
    content:''; position:absolute; bottom:-20px; left:0; right:0; height:40px;
    background:#f0f7f0; border-radius:50% 50% 0 0 / 20px 20px 0 0;
  }
  .hero-img { width:100%; max-height:170px; object-fit:cover; border-radius:14px; margin-bottom:14px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .hero h2 { font-size:20px; font-weight:800; }
  .hero p { font-size:13px; opacity:.8; margin-top:4px; }

  .content { flex:1; padding:20px; }

  .nav-tabs {
    display:flex; gap:8px; margin-bottom:20px;
    background:#fff; border-radius:14px; padding:6px; box-shadow:var(--shadow);
  }
  .nav-tab {
    flex:1; padding:10px; border:none; background:transparent;
    border-radius:10px; font-family:inherit; font-size:13px; font-weight:600;
    color:var(--gray-mid); cursor:pointer; transition:.2s;
  }
  .nav-tab.active { background:var(--green-deep); color:#fff; }

  .section { display:none; }
  .section.active { display:block; }

  .card { background:#fff; border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:16px; }
  .card-title { font-size:15px; font-weight:700; color:var(--green-deep); margin-bottom:14px; }

  .form-group { margin-bottom:14px; }
  .form-label { font-size:12px; font-weight:600; color:var(--green-deep); margin-bottom:6px; display:block; }
  .form-input, .form-textarea {
    width:100%; padding:12px 14px; border:1.5px solid #e0e0e0;
    border-radius:10px; font-family:inherit; font-size:14px; outline:none; transition:.2s; background:#fff;
  }
  .form-input:focus, .form-textarea:focus { border-color:var(--green-light); box-shadow:0 0 0 3px rgba(76,175,80,.1); }
  .form-textarea { resize:vertical; min-height:90px; }

  .cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cat-btn {
    padding:14px 10px; border:2px solid #e0e0e0; border-radius:12px;
    background:#fff; font-family:inherit; font-size:13px; font-weight:600;
    color:var(--gray-mid); cursor:pointer; transition:.2s; text-align:center;
  }
  .cat-icon-block {
    display:block; width:30px; height:30px; border-radius:8px;
    margin:0 auto 6px; background:#e8e8e8; transition:.2s;
  }
  .cat-btn.selected { border-color:var(--green-light); background:var(--green-pale); color:var(--green-deep); }
  .cat-btn.selected .cat-icon-block { background:var(--green-light); }

  .photo-upload {
    border:2px dashed #c8e6c9; border-radius:12px; padding:22px 20px;
    text-align:center; cursor:pointer; background:var(--green-pale); transition:.2s;
  }
  .photo-upload:hover { border-color:var(--green-light); }
  .photo-upload input { display:none; }
  .upload-ico-wrap { width:44px; height:44px; background:#c8e6c9; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; }
  .upload-ico-wrap svg { width:22px; height:22px; stroke:var(--green-deep); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .photo-upload p { font-size:12px; color:var(--gray-mid); }
  .photo-preview { width:100%; border-radius:10px; margin-top:10px; display:none; }

  .btn-submit {
    width:100%; padding:14px; background:var(--green-deep); color:#fff;
    border:none; border-radius:12px; font-family:inherit; font-size:15px;
    font-weight:700; cursor:pointer; transition:.2s; letter-spacing:.2px;
  }
  .btn-submit:hover { background:var(--green-mid); }
  .btn-submit:disabled { opacity:.6; cursor:not-allowed; }

  .announcement-item {
    background:#fff; border-radius:14px; padding:16px; box-shadow:var(--shadow);
    margin-bottom:12px; border-left:4px solid var(--green-light); animation:slideIn .3s ease;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  .ann-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .ann-avatar { width:32px; height:32px; border-radius:50%; background:var(--green-deep); flex-shrink:0; }
  .ann-name { font-size:13px; font-weight:700; color:var(--green-deep); }
  .ann-time { font-size:11px; color:var(--gray-mid); margin-left:auto; }
  .ann-msg { font-size:14px; color:#333; line-height:1.5; }
  .empty-state { text-align:center; padding:48px 20px; color:var(--gray-mid); }
  .empty-circle { width:52px; height:52px; border-radius:50%; background:#e0e0e0; margin:0 auto 12px; }
  .empty-state p { font-size:13px; }

  .toast {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--green-deep); color:#fff; padding:12px 24px; border-radius:30px;
    font-size:13px; font-weight:600; z-index:999; opacity:0; transition:.3s; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .bottom-nav {
    background:#fff; display:flex; border-top:1px solid #e8f5e9;
    position:sticky; bottom:0; box-shadow:0 -4px 12px rgba(0,0,0,.06);
  }
  .bot-nav-btn {
    flex:1; padding:12px 0; border:none; background:transparent;
    font-family:inherit; font-size:10px; font-weight:600; color:var(--gray-mid);
    cursor:pointer; transition:.2s; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .bot-nav-btn svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .bot-nav-btn.active { color:var(--green-deep); }

  .spinner { display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-leaf"></div>
  <h1>Laporan Hijau</h1>
  <p>Sekolah Adiwiyata Digital</p>
</div>

<div class="app active" id="appMurid">
  <div class="header">
    <div class="header-dot"></div>
    <h1>Laporan Hijau</h1>
    <span class="badge">MURID</span>
  </div>

  <div class="hero">
    <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=600&q=80" class="hero-img" alt="Lingkungan Sekolah" onerror="this.style.display='none'">
    <h2>Jaga Lingkungan Sekolah</h2>
    <p>Laporkan masalah lingkungan dan baca pengumuman terbaru</p>
  </div>

  <div class="content">
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('laporan')">Laporan</button>
      <button class="nav-tab" onclick="switchTab('pengumuman')">Pengumuman</button>
    </div>

    <div class="section active" id="sec-laporan">
      <div class="card">
        <div class="card-title">Kirim Laporan</div>

        <div class="form-group">
          <label class="form-label">Nama Pelapor *</label>
          <input type="text" class="form-input" id="namaPelapor" placeholder="Nama lengkap kamu">
        </div>
        <div class="form-group">
          <label class="form-label">Kelas *</label>
          <input type="text" class="form-input" id="kelas" placeholder="Contoh: 7A, 8B, 9C">
        </div>
        <div class="form-group">
          <label class="form-label">Lokasi *</label>
          <input type="text" class="form-input" id="lokasi" placeholder="Contoh: Kantin, Lapangan, Toilet">
        </div>

        <div class="form-group">
          <label class="form-label">Kategori *</label>
          <div class="cat-grid">
            <button class="cat-btn" onclick="selectKategori(this,'sampah')">
              <span class="cat-icon-block"></span>Sampah
            </button>
            <button class="cat-btn" onclick="selectKategori(this,'air')">
              <span class="cat-icon-block"></span>Air
            </button>
            <button class="cat-btn" onclick="selectKategori(this,'tanaman')">
              <span class="cat-icon-block"></span>Tanaman
            </button>
            <button class="cat-btn" onclick="selectKategori(this,'kebersihan')">
              <span class="cat-icon-block"></span>Kebersihan
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Foto</label>
          <div class="photo-upload" onclick="document.getElementById('fotoInput').click()">
            <input type="file" id="fotoInput" accept="image/*" onchange="previewFoto(this)">
            <div class="upload-ico-wrap">
              <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
            <p>Tap untuk tambah foto</p>
          </div>
          <img id="fotoPreview" class="photo-preview">
        </div>

        <div class="form-group">
          <label class="form-label">Penjelasan *</label>
          <textarea class="form-textarea" id="penjelasan" placeholder="Jelaskan masalah yang kamu temukan..."></textarea>
        </div>

        <button class="btn-submit" id="btnKirim" onclick="kirimLaporan()">Kirim Laporan</button>
      </div>
    </div>

    <div class="section" id="sec-pengumuman">
      <div class="card-title" style="padding:0 4px;margin-bottom:12px;">Pengumuman dari Petugas</div>
      <div id="listPengumuman">
        <div class="empty-state"><div class="empty-circle"></div><p>Memuat pengumuman...</p></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="bot-nav-btn active" onclick="switchTab('laporan')">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Laporan
    </button>
    <button class="bot-nav-btn" onclick="switchTab('pengumuman')">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Pengumuman
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://vtnxrqmgroldxqgxdyir.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0bnhycW1ncm9sZHhxZ3hkeWlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MzY0NjIsImV4cCI6MjA5MzIxMjQ2Mn0.gCdY1Fq1djq7FYEZE-jn3j4KGsREcdQLk3eToQw6qCw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let kategoriPilih = '';

setTimeout(() => {
  document.getElementById('splash').style.opacity = '0';
  setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
}, 1800);

function switchTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.bot-nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + tab).classList.add('active');
  const tabs = document.querySelectorAll('.nav-tab');
  const bots = document.querySelectorAll('.bot-nav-btn');
  if (tab === 'laporan') { tabs[0].classList.add('active'); bots[0].classList.add('active'); }
  else { tabs[1].classList.add('active'); bots[1].classList.add('active'); loadPengumuman(); }
}

function selectKategori(el, kat) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  kategoriPilih = kat;
}

function previewFoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('fotoPreview');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function showToast(msg, duration=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

async function uploadFoto(file) {
  if (!file) return null;
  const ext = file.name.split('.').pop();
  const fname = `laporan_${Date.now()}.${ext}`;
  const { data, error } = await sb.storage.from('laporan-foto').upload(fname, file, { upsert: true });
  if (error) return null;
  const { data: urlData } = sb.storage.from('laporan-foto').getPublicUrl(fname);
  return urlData.publicUrl;
}

async function kirimLaporan() {
  const nama = document.getElementById('namaPelapor').value.trim();
  const kelas = document.getElementById('kelas').value.trim();
  const lokasi = document.getElementById('lokasi').value.trim();
  const penjelasan = document.getElementById('penjelasan').value.trim();
  const fotoFile = document.getElementById('fotoInput').files[0];

  if (!nama || !kelas || !lokasi || !penjelasan || !kategoriPilih) {
    showToast('Isi semua field yang wajib ya!'); return;
  }

  const btn = document.getElementById('btnKirim');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Mengirim...';

  try {
    let fotoUrl = null;
    if (fotoFile) fotoUrl = await uploadFoto(fotoFile);

    const { error } = await sb.from('laporan').insert([{
      nama_pelapor: nama, kelas, lokasi, kategori: kategoriPilih,
      penjelasan, foto_url: fotoUrl, status: 'baru',
      created_at: new Date().toISOString()
    }]);

    if (error) throw error;
    showToast('Laporan berhasil dikirim!');
    document.getElementById('namaPelapor').value = '';
    document.getElementById('kelas').value = '';
    document.getElementById('lokasi').value = '';
    document.getElementById('penjelasan').value = '';
    document.getElementById('fotoInput').value = '';
    document.getElementById('fotoPreview').style.display = 'none';
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
    kategoriPilih = '';
  } catch(e) {
    showToast('Gagal kirim. Coba lagi!');
    console.error(e);
  }

  btn.disabled = false;
  btn.innerHTML = 'Kirim Laporan';
}

function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (diff < 60) return 'baru saja';
  if (diff < 3600) return Math.floor(diff/60) + ' menit lalu';
  if (diff < 86400) return Math.floor(diff/3600) + ' jam lalu';
  return Math.floor(diff/86400) + ' hari lalu';
}

async function loadPengumuman() {
  const container = document.getElementById('listPengumuman');
  const { data, error } = await sb.from('pengumuman').select('*').order('created_at', { ascending: false }).limit(50);
  if (error || !data || data.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-circle"></div><p>Belum ada pengumuman</p></div>';
    return;
  }
  container.innerHTML = data.map(p => `
    <div class="announcement-item">
      <div class="ann-header">
        <div class="ann-avatar"></div>
        <span class="ann-name">${p.nama_petugas || 'Petugas'}</span>
        <span class="ann-time">${timeAgo(p.created_at)}</span>
      </div>
      <div class="ann-msg">${p.pesan}</div>
    </div>
  `).join('');
}

sb.channel('pengumuman-realtime')
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pengumuman' }, payload => {
    const currentTab = document.querySelector('.section.active');
    if (currentTab && currentTab.id === 'sec-pengumuman') loadPengumuman();
    else showToast('Ada pengumuman baru!');
  }).subscribe();
</script>
</body>
</html>
